<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5efe1" />
  <meta name="description" content="Java 백엔드 개발자 송다원의 개발 경험과 구현 기록. 심리검사, 결제, 인증, 리포트 연동을 소개합니다." />
  <title>송다원 · Java Backend Developer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#slide">본문으로 건너뛰기</a>
  <header class="site-masthead">
    <a class="site-identity" href="#cover">송다원 <span>Java Backend Developer</span></a>
    <span class="site-description">개발 경험과 구현 기록</span>
  </header>
  <main class="portfolio-slide-app">
    <aside class="portfolio-index">
      <nav id="slideDots" class="portfolio-slide-dots" aria-label="포트폴리오 목차"></nav>
      <p class="index-context">에듀인테크 개발팀<br><span>2023.08 — 2025.09</span></p>
    </aside>
    <section class="portfolio-slide-stage" aria-label="포트폴리오 본문">
      <article id="slide" class="portfolio-slide-card" tabindex="-1"></article>
      <nav class="portfolio-slide-controls" aria-label="슬라이드 이동">
        <select id="chapterSelect" class="portfolio-chapter-select" aria-label="포트폴리오 목차"></select>
        <div class="portfolio-slide-status" role="status" aria-live="polite" aria-atomic="true" aria-label="현재 슬라이드">
          <strong id="currentSlide">01</strong><span>/</span><span id="totalSlides">14</span>
        </div>
        <button id="prevSlide" class="portfolio-slide-nav-button" type="button" aria-label="이전 슬라이드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
        <button id="nextSlide" class="portfolio-slide-nav-button" type="button" aria-label="다음 슬라이드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      </nav>
    </section>
  </main>
  <script src="slides.js"></script>
</body>
</html>
